{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h2>رمز عبور جدید را انتخاب کنید</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-field">
        <label for="id_new_password">رمز عبور جدید</label>
        {{ form.new_password }}
        {% if form.new_password.errors %}<div class="form-error">{{ form.new_password.errors.0 }}</div>{% endif %}
      </div>
      <div class="form-field">
        <label for="id_new_password_confirm">تکرار رمز عبور جدید</label>
        {{ form.new_password_confirm }}
      </div>
      <button type="submit" class="btn btn-primary btn-block">به‌روزرسانی رمز عبور</button>
    </form>
  </div>
</div>
{% endblock %}
