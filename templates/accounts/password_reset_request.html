{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h2>بازیابی رمز عبور</h2>
    <p>ایمیل یا شماره تلفن حساب خود را وارد کنید.</p>

    {% if message %}<div class="form-message">{{ message }}</div>{% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-field">
        <label for="id_identifier">ایمیل یا شماره تلفن</label>
        {{ form.identifier }}
      </div>
      <button type="submit" class="btn btn-primary btn-block">ارسال دستورالعمل بازیابی</button>
    </form>
  </div>
</div>
{% endblock %}
